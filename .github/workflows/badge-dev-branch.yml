name: eyeris dev branch version badge

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  badge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Trash old badge
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch origin badges
          git checkout badges
          git pull origin badges
          rm dev-branch-version.svg
          git add -A
          git commit -m "removed old dev-branch-version.svg file [skip ci]" || echo "no changes to commit"
          git push origin badges

      - name: Create badge
        uses: emibcn/badge-action@v2
        with:
          label: dev
          status: ${{ steps.version.outputs.version }}
          color: blue
          path: dev-branch-version.svg

      - name: Clean up untracked files
        run: git clean -fd

      - name: Commit and push badge
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch origin badges
          git checkout badges
          git pull origin badges
          git add dev-branch-version.svg
          git commit -m "update dev branch version badge [skip ci]" || echo "no changes to commit"
          git push origin badges

name: eyeris dev branch version badge

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  badge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create badge
        uses: emibcn/badge-action@v2
        with:
          label: dev
          status: ${{ steps.version.outputs.version }}
          color: blue
          path: dev-version.svg

      - name: Commit and push badge
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch origin badges
          git checkout badges
          git pull origin badges  # <-- THIS resolves the non-fast-forward
          git add inst/figures/dev-version.svg
          git commit -m "Update dev version badge [skip ci]" || echo "No changes to commit"
          git push origin badges

url: http://shawnschwartz.com/eyeris/

news:
    cran_dates: true
    releases:
    - text: "v1.0.1 (devel)"
      href: news/index.html#eyeris-101
    - text: "v1.0.0 (CRAN)"
      href: news/index.html#eyeris-100
    - text: "v0.1.0.9001 (devel)"
      href: news/index.html#eyeris-0109001
    - text: "v0.1.0.9000 (devel)"
      href: news/index.html#eyeris-0109000
    - text: "v0.0.0.9000 (devel)"
      href: news/index.html#eyeris-0009000

home:
  sidebar:
    structure: [authors, citation, links, license, dev]

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github, lightswitch]

template:
  bootstrap: 5
  light-switch: true
  theme: breeze-light
  theme-dark: gruvbox-dark
  math-rendering: mathjax
  bslib:
      bootswatch: united
      base_font: {google: "Raleway"}
      heading_font: {google: "Open Sans"}
      code_font: {google: "JetBrains Mono"}
      pkgdown-nav-height: 100px

footer:
  structure:
    left: developed_by
    right: [built_with, legal]
  components:
    legal: Provided without **any warranty**.

authors:
  Shawn Schwartz:
      href: "http://shawnschwartz.com"
  footer:
      roles: [cre]
      text: "Made with ♥ in Palo Alto by"
  sidebar:
      roles: [aut, fnd, ctb]

reference:
  - title: "[start here] \"glassbox\" all-in-one wrapper"
    contents:
    - glassbox
  - title: "[next] extract trial epochs"
    contents:
    - epoch
  - title: "[and finally] exporting your preprocessed data + visualize with interactive HTML reports"
    contents:
    - bidsify
    - plot.eyeris
  - title: "[helper functions] core preprocessing operations"
    contents:
    - load_asc
    - deblink
    - detransient
    - interpolate
    - lpfilt
    - detrend
    - zscore
  - title: "[advanced] building custom extensions"
    contents:
    - pipeline_handler

articles:
  - title: Start Here
    navbar: Start Here
    contents:
    - complete-pipeline
    - epoching-bids-reports
  - title: Pupil Data Quality Control
    navbar: Pupil Data Quality Control
    contents:
    - reports
  - title: Advanced Topics
    navbar: Advanced Topics
    contents:
    - anatomy
    - custom-extensions
